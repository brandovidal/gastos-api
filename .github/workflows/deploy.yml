name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/unit-test.yml

  db:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      # postinstall also runs prisma generate (the seed uses the generated client)
      - run: pnpm install --frozen-lockfile
      - name: Apply pending migrations
        run: pnpm exec tsx scripts/db-deploy.ts
      - name: Seed catalogs (safe to re-run)
        run: pnpm exec tsx prisma/seed.ts

  telegram:
    needs: db
    runs-on: ubuntu-latest
    environment: production
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Register webhook and command menu
        run: pnpm exec tsx scripts/telegram-setup.ts "$PUBLIC_URL"
