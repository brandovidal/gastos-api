name: Tests

# Pull requests to main, and reused by deploy.yml before every deploy
on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack (for pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Create test env
        # Tests never call R2 (D58): files go to a local folder
        run: cp .env.example .env.test && sed -i -e 's/^STORAGE_ENV=.*/STORAGE_ENV=test/' -e 's/^OCR_ENABLED=.*/OCR_ENABLED=false/' .env.test

      - name: Run Unit Tests
        run: pnpm test:ci

      # SQLite file recreated with every migration (test/integration.setup.ts); no secrets, no AI calls
      - name: Run Integration Tests
        run: pnpm test:integration
